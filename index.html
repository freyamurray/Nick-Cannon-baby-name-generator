<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nick Cannon baby name generator</title>
    <link rel="Icon" href="nick-cannon-icon.png">
</head>

<style>
    * {
        box-sizing: border-box;
    }

    @font-face {
        font-family: hello;
        src: url(Hello.ttf);
    }

    body {
        margin: 0;
        padding: 0 1rem;
        background-color: rgb(155, 60, 0);
    }

    main {
        height: calc(100dvh - 2rem);
        margin: 1rem auto;
        align-content: center;
        background-color: rgb(253, 231, 222);
        border-radius: 2rem;
        max-width: 40rem;
        display: flex;
        flex-direction: column;
        justify-content: space-evenly;
        padding-bottom: 1rem;
    }

    .name-container {
        align-content: center;
        margin: 0 auto;
    }

    .blurb {
        text-align: center;
        margin-bottom: -1rem;
        margin-top: 2rem;
    }

    .name {
        justify-self: center;
        font-size: 4rem;
        font-family: hello;
        margin: 2rem auto;
        padding: 1rem;
        text-align: center;
        text-shadow: rgb(255, 145, 0) 1px 1px 1px;
        height: 10rem;
        align-content: center;
        background: radial-gradient(white, transparent, transparent);
    }

    p {
        font-family: Verdana, Geneva, Tahoma, sans-serif;
    }

    button {
        display: flex;
        margin: 1rem auto;
        font-size: 1.4rem;
        cursor: pointer;
        background: white;
        padding: 1rem;
        border: solid 2px;
        border-radius: 1rem;
        transition-duration: .2s;
        font-family: Verdana, Geneva, Tahoma, sans-serif;
        color: rgb(155, 60, 0);

        &&:hover {
            background-color: rgb(155, 60, 0);
            color: white;
            border: 2px solid rgb(155, 60, 0);
        }

        &&:active {
            scale: 95%;
        }
    }

    .nick-cannon {
        margin: auto;
        width: 19rem;
        height: 16rem;
        margin-top: 1rem;
        /* outline: solid; */
        object-fit: cover;

        img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    }

    .footer {
        margin-top: -4rem;
        font-size: .8rem;
        text-align: center;
        padding: 0rem 1rem;
        text-wrap: wrap;

        a {
            color: rgb(155, 60, 0);
        }

        p {
            margin: 0rem;
        }
    }
</style>

<body onload="newName(), randomNickCannon()">
    <main>
        <div class="name-container">
            <p class="blurb">Your Nick Cannon baby name is</p>
            <p class="name">
                <span id="firstname"></span>
                <span id="secondname"></span>
            </p>
            <button role="button" onclick="newName(), randomNickCannon()">Generate</button>
        </div>
        <div class="nick-cannon" id="nick-cannon-pic">
        </div>
        <div class="footer">
            <p>Site by <a href="https://github.com/freyamurray">Freya Murray</a>.</p>
            <p> If you liked this silly little project, consider <a href="https://ko-fi.com/7reya">buying me a kofi!</a>
            </p>
        </div>
    </main>
</body>

<script>
    const firstnames = [
        "Celestial", "Chrome", "Platinum", "Disciple", "Iconic", "Superior", "Mighty", "Strong", "Mighty", "Effervescent", "Sparkling", "Trillion", "Superior", "Exalted", "Fahrenheit", "Obsidian", "Stunning", "Holy", "Transcendent", "Mythic", "Apocryphal", "Indescribable", "Opulent", "Lavish", "Crystalline", "Ethereal", "Halcyon", "Tranquil", "Cosmic", "Luminous", "Fierce", "Goliath", "Alpha", "Elysian", "Incandescent", "Dazzling", "Luxe", "Prismatic", "Abundant", "Angel", "Exquisite", "Divine", "Forever", "Cartier", "Sterling", "Saint", "Satin", "Mercy", "Liminal", "Shimmering", "Dream", "Irridescent", "Ermine"
    ];

    const secondnames = [
        "Pope", "Sphinx", "Phrygian", "Locrian", "Lydian", "Love", "Chiffon", "Lava", "Emerald", "Opal", "Meditation", "Everest", "Zenith", "Duchess", "Caviar", "Diamond", "Zirconia", "Xanadu", "Extravaganza", "Couture", "Aurora", "Borealis", "Ephemera", "Labyrinth", "Serendipity", "Stardust", "Diva", "Princess", "Icon", "Genesis", "Zephyr", "Reverie", "Catharsis", "Plethora", "Syzergy", "Epiphany", "Bliss", "Carat", "Hermes", "Champagne", "Swarovski", "Prayer", "Dior", "Perignon", "Cashmere", "Prada", "Heaven", "King", "Prince", "Marquise", "Royalty", "Hero", "Archer", "Goddess", "Psalm", "Air", "Silk", "Topaz", "Aspiration", "Ziggurat", "Supreme", "Royale"
    ];

    function newName() {
        let firstname, secondname;
        firstname = document.getElementById("firstname");
        secondname = document.getElementById("secondname");

        const randomFirst = Math.floor(Math.random() * firstnames.length);

        const randomSecond = Math.floor(Math.random() * secondnames.length);

        firstname.innerHTML = firstnames[randomFirst];
        secondname.innerHTML = secondnames[randomSecond];
    }

    const nickCannons = [
        "<img src='images/nick-cannon1.png' alt='Nick Cannon'>",
        "<img src='images/nick-cannon2.avif' alt='Nick Cannon'>",
        "<img src='images/nick-cannon3.png' alt='Nick Cannon'>",
        "<img src='images/nick-cannon4.png' alt='Nick Cannon'>",
        "<img src='images/nick-cannon5.webp' alt='Nick Cannon'>",
        "<img src='images/nick-cannon6.png' alt='Nick Cannon'>",
        "<img src='images/nick-cannon7.png' alt='Nick Cannon'>",
        "<img src='images/nick-cannon8.png' alt='Nick Cannon'>",
        "<img src='images/nick-cannon9.png' alt='Nick Cannon'>",
        "<img src='images/nick-cannon10.png' alt='Nick Cannon'>",
        "<img src='images/nick-cannon11.png' alt='Nick Cannon'>",
        "<img src='images/nick-cannon12.png' alt='Nick Cannon'>"



    ]

    function randomNickCannon() {
        const randomNickCannon = Math.floor(Math.random() * nickCannons.length);

        document.getElementById("nick-cannon-pic").innerHTML = nickCannons[randomNickCannon]

    }
</script>

</html>
